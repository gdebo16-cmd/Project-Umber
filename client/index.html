<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Geist+Pixel&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Delicious+Handrawn&family=Geist+Pixel&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Delicious+Handrawn&family=Geist+Pixel&family=New+Rocker&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eldrid Tales" />
    <style>
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-ring {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #6366f1, #ec4899);
        border-radius: 42% 58% 70% 30% / 55% 30% 70% 45%;
        animation: liquid 4s ease-in-out infinite;
      }

      @keyframes liquid { 
        0% { border-radius: 42% 58% 70% 30% / 55% 30% 70% 45%; }
        50% { border-radius: 70% 30% 42% 58% / 30% 70% 45% 55%; }
        100% { border-radius: 42% 58% 70% 30% / 55% 30% 70% 45%; }
      }
    </style>
    <title>Eldrid Tales</title>
  </head>
  <body>
    <div class="fixed-bg"></div>
    <div id="root">
      <div class="boot-loader"><div class="boot-ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
