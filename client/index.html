<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eldrid Tales" />
    <style>
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-ring {
        width: 3.5rem; height: 3.5rem; border-radius: 50%;
        background: conic-gradient(rgba(122, 28, 36, 0.15) 0%, rgba(176, 141, 87, 0.55) 80%, rgba(122, 28, 36, 0.15) 100%);
        opacity: 0.6;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
        animation: boot-spin 1.4s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <title>Eldrid Tales</title>
  </head>
  <body>
    <div class="fixed-bg"></div>
    <div id="root">
      <div class="boot-loader"><div class="boot-ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
