<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- fonts used by home / login / create pages -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <!-- fonts used by the character sheet (same links as character.ejs) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=neon|outline|emboss|shadow-multiple">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="rgb(65, 37, 157)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>html { padding-top: env(safe-area-inset-top); }</style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eldrid Tales" />
    <style>
      html { background-color: rgb(65, 37, 157); } body { margin: 0; }
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-ring {
        width: 3.5rem; height: 3.5rem; border-radius: 50%;
        background: conic-gradient(#333 0%, red 70%, #333 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
        animation: boot-spin 0.9s linear infinite, boot-hue 3s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-hue { from { filter: blur(1px) hue-rotate(0deg); } to { filter: blur(1px) hue-rotate(360deg); } }
    </style>
    <title>Eldrid Tales</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader"><div class="boot-ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
