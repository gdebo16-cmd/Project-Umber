<!DOCTYPE html>
<html lang="'en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="signin.css">
    <script src="main.js" async></script>
    <title>Eldrid Tales</title>
</head>

<body>
    <header id="topContainer">
         <h1 id="siteTitle">Eldrid Tales</h1>
    </header>

    <main>
        <section id="formContainer">
            <article id="formTitle">
                <h2 id="titleText">Welcome to Your Legend</h2> 
            </article>
            <form class="formContainer" action="/auth/login" method="POST">
                <article class="formSectionContainer tile" id="userNameContainer">
                    <label id="userNameLabel" class="topTile" for="userName">Enter Username</label>
                    <input class="bottomTile" type="text" id="userName" name="username" required>
                </article>
            
                <article class="formSectionContainer tile" id="passwordContainer">
                    <label id="passwordLabel" class="topTile" for="password">Enter Password</label>
                    <input class="bottomTile" type="password" id="password" name="password" required>
                </article>
            
                <article class="formSectionContainer" id="buttonContainer">
                    <button id="submit" class="formButton" type="submit">Login</button>
                    <a href="/register" class="formButton" id="newUser">Create New User</a>
                </article>
            </form>
            
        </section>
    </main>
</body>
<footer>
    <p id="footerText">© 2026 Eldrid Tales. All rights reserved.</p>
</footer>
</html>
