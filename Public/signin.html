<!DOCTYPE html>
<html lang="'en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="signin.css">
    <script src="main.js" async></script>
    <title>Eldrid Tales</title>
</head>

<body>
    <header>
         <h1>Eldrid Tales</h1>
    </header>
    <main>
        <section id="title">
            <h2>Welcome to Your Legend</h2> 
        </section>
        
        <form id="formContainer" action="/submit" method="POST">
            <article class="formContainer" id="userNameContainer">
                <label for="userName">Enter Username</label>
                <input type="text" id="userName" name="userName" required>
            </article>
            
            <article class="formContainer" id="passwordContainer">
                <label for="password">Enter Password</label>
                <input type="password" id="password" name="password" required>
            </article>
            
            <article class="'formContainer" id="buttonContainer">
                <button id="submit" type="submit">Login</button>
                <a href="/register" id="newUser">Create New User</a>
            </article>
        </form>
    </main>
</body>
<footer>

</footer>
</html>
