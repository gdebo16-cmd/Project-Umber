<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/char_create.css">
    <title>Create Character — Step 2</title>
</head>

<body>
    <header>
      <h1>Create Character</h1>
      <p id="title">Step 2 of 4 — Name and race</p>
    </header>
    <main id="charMain">
      <section id="formContainer">
        <form action="/create_char/step2" method="POST">
          <article id="classContainer" class="formContainer tile">
            <label class="topTile" for="class_id">Select Class</label>
              <select class="bottomTile" id="class_id" name="class_id" required>
                {{classOptions}}
          </article>

          <article id="subClassContainer" class="formContainer tile">
          <label class="topTile" for="subclass_id">Race</label>
            <select class="bottomTile" id="race_id" name="race_id" selected="Choose Your Race" required>
               {{subclassOptions}}
            </select>
          </article>

          <article id="buttonContainer" class="formContainer">
            <button id="submit" type="submit">Next: Abilities</button>
          </article>
        </form>
    </section>  
    </main>
    <footer>
      <a id="homeLink" href="/home">Cancel</a>
    </footer>
  </body>
  </html>
