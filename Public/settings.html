<!DOCTYPE html>
<html lang="'en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" href="home.css">
    <title>Eldrid Tales</title>
</head>

<body>
    <header>
        <h1 id="title">Welcome {{username}}, To Eldridia</h1>
        <nav id="navBox">
            <ul class="navContainer">
                <li>
                    <a href="/home">home</a>
                </li>

                <li>Characters
                        <ul class="dropDown" id="characterDropdown">
                            <a href="/create_char">Create Character</a>
                            <a href="/char_list">Character List</a>
                        </ul>
                </li>
                
                <li>Campaigns
                    <ul class="dropDown" id="campaignDropdown">
                        <a href="/create_campaign">Create Campaign</a>
                        <a href="/campaign_list">Campaign List</a>
                        <a href="/premade">Premade Campaigns</a>
                    </ul>
                </li>

                <li>Settings
                    <ul class="dropDown" id="settingsDropdown">
                        <a href="/profile">Profile</a>
                        <a href="/settings">Settings</a>
                        <a href="/login">Log Out</a>
                    </ul>
                </li>
                
            </ul>

            </ul>
        </nav>
    </header>
    <main id="settingsMain">
        <section id="settingsTitle">
            <h2>Settings</h2>
        </section>
        <section id="formContainer">
            <h3>Account Information</h3>
                <form action="/settings" method="POST">
                    <article id="userNameContainer" class="formContainer">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" value="{{username}}">
                    </article>
                    
                    <article id="emailContainer" class="formContainer">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{email}}">
                    </article>
                    
                    
                    <article id="passwordContainer" class="formContainer">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" value="">
                    </article>
                    
                    <article id="buttonContainer" class="formContainer">
                        <button id="submit" type="submit">Update Account</button>
                    </article>
                </form>
        </section>
    </main>
    <footer id="homeLink">
            <a id="homeButton" href="/home">Back to home</a>
            <h4>copyrite Eldrid Tales LLC</h4>
    </footer>
</body>
</html>
