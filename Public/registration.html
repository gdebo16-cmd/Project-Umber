<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css"/>
  <title>Create Account — Eldrid Tales</title>
</head>
<body>
  <header id="topContainer">
    <h1 id="siteTitle">Eldrid Tales</h1>
  </header>

  <main>
    <section id="formContainer">
      <article id="formTitle">
        <h2 id="titleText">Create Your Legend</h2>
      </article>
      <form class="formContainer" action="/auth/register" method="POST">
        <article class="formSectionContainer tile" id="userNameContainer" class="formContainer tile">
          <label id="userNameLabel" class="topTile" for="userName">Username</label>
          <input class="bottomTile" type="text" id="userName" name="username" required />
        </article>
    
        <article class="formSectionContainer tile" id="passwordContainer" class="formContainer tile">
          <label id="passwordLabel" class="topTile" for="password">Password</label>
          <input class="bottomTile" type="password" id="password" name="password" required />
        </article>

        <article class="formSectionContainer tile" id="emailContainer" class="formContainer tile">
          <label id="emailLabel" class="topTile" for="email">Email</label>
          <input class="bottomTile" type="email" id="email" name="email" />
        </article>
        
        <article class="formSectionContainer tile" id="nameContainer" class="formContainer tile">
          <label id="nameLabel" class="topTile" for="name">Display Name</label>
          <input class="bottomTile" type="text" id="name" name="name" />
        </article>
      
        <article class="formSectionContainer tile" id="regButtonContainer" class="formContainer">
          <button class="formButton" id="submit" type="submit">Create Account</button>
        </article>
      </form>
    </section>
  </main>
</body>
<footer>
    <p id="footerText">© 2026 Eldrid Tales. All rights reserved.</p>
    <a id="loginLink" href="/login">Back to login</a>
</footer>
</html>
