<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css"/>
  <title>Create Account — Eldrid Tales</title>
</head>
<body>
  <header>
    <h1>Eldrid Tales</h1>
  </header>
  <main>
    <section id="title">
      <h2>Create Your Legend</h2>
    </section>

    <section id="formContainer">
      <form id="registrationForm" action="/register" method="POST">

        <article id="userNameContainer" class="formContainer">
          <label for="userName">Username</label>
          <input type="text" id="userName" name="userName" required />
        </article>
      
        <article id="passwordContainer" class="formContainer">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </article>
      
      <article id="emailContainer" class="formContainer">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
      </article>
      
      <article id="nameContainer" class="formContainer">
        <label for="name">Display Name</label>
        <input type="text" id="name" name="name" />
        </div>
      
        <article id="buttonContainer" class="formContainer">
          <button id="submit" type="submit">Create Account</button>
        </article>
      </form>
    </section>
  </main>
</body>
<footer>
  <section id="loginContainer">
    <p><a id="loginLink" href="/login">Back to login</a></p>
  </section>
</footer>
</html>
