<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="home.css">
  <title>Create Character — Step 1</title>
</head>
<body>
    <header>
      <h1>Create Character</h1>
      <p>Step 1 of 4 — Name and race</p>
    </header>
    <main>
      <form action="/create_char/step1" method="POST">
        <label for="name">Character name</label>
        <input type="text" id="name" name="name" required>
        <label for="race_id">Race</label>
        <select id="race_id" name="race_id" required>
          {{raceOptions}}
        </select>
        <button type="submit">Next: Class</button>
      </form>
      <p><a href="/home">Cancel</a></p>
    </main>
  </body>
  </html>
